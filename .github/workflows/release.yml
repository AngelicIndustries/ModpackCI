name: Release

# Push a tag like v1.2.0. The release gets the tool jar, the wrapper scripts, packwiz for each OS
# and starter.zip, and the major tag (v1) moves to it so pack repos using @v1 pick it up.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  # The packwiz commit ModpackCI ships, built for every OS so nobody has to install Go.
  PACKWIZ_COMMIT: 170b22d785959dda5876b54b7f16e1b807a57fb6

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ModpackCI
        run: ./gradlew build -PmodpackciVersion="${GITHUB_REF_NAME#v}"

      - name: Build packwiz
        run: |
          git clone --quiet https://github.com/packwiz/packwiz "$RUNNER_TEMP/packwiz"
          git -C "$RUNNER_TEMP/packwiz" checkout --quiet "$PACKWIZ_COMMIT"
          mkdir -p dist
          for target in linux/amd64/linux-x64 linux/arm64/linux-aarch64 darwin/amd64/macos-x64 \
              darwin/arm64/macos-aarch64 windows/amd64/windows-x64 windows/arm64/windows-aarch64; do
            IFS=/ read -r goos goarch name <<< "$target"
            ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            (cd "$RUNNER_TEMP/packwiz" && CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -o "$GITHUB_WORKSPACE/dist/packwiz-$name$ext" .)
          done

      - name: Build starter.zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          java -jar "build/libs/modpackci-$version.jar" starter "$RUNNER_TEMP/starter"
          (cd "$RUNNER_TEMP/starter" && zip -qr "$GITHUB_WORKSPACE/dist/starter.zip" .)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "build/libs/modpackci-$version.jar" src/main/resources/templates/modpackw \
            src/main/resources/templates/modpackw.bat dist/
          gh release create "$GITHUB_REF_NAME" dist/* --title "ModpackCI $version" --generate-notes --verify-tag

      - name: Move the major version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
